# The sapbuddy agent preset, shipped as this package's bundle patch.
#
# DSH 0.2.0-rc.2 has no preset directory scanning: a preset is this declarative
# row, and `package.json` → `dsh.bundle.patch` is what makes `dsh plugin add`
# apply it (no `dsh.bundle` = "installed as a plain dependency, not a profile
# layer", and the preset never appears in the picker).
#
# One package, one Loader row. Everything SapBuddy needs host-side hangs off the
# single `sapbuddy-dsh` row below: the 41 SAP tools, the write gate, the prompt
# injection, and the settings-page routes (`webServer` is optional, so headless
# profiles skip them). A package declaring `dsh.client` may have only ONE active
# Loader source — `client-modules` rejects a second with "resolves from multiple
# active Loader sources" — which is why the settings page cannot be its own row.
#
# The composition is the shipped `standard` preset (the authoritative row set for
# this DSH version) plus the SapBuddy layers:
#   - the `sapbuddy-dsh` row: 41 SAP tools + the write gate + settings routes
#   - `skill-filesystem.customSkillDirs`: the eight ABAP skills bundled in this
#     package, resolved through createRequire so any install layout works
#
# `sapbuddy-dsh` resolves as a bare package name, so it must be a real
# dependency of the profile rather than a `link:`/`file:` path.

# ── 行 1：设置页（顶层 / deployment-global）────────────────────────────────
#
# 行名**必须是裸包名**，不能写成子路径 `sapbuddy-dsh/settings`：
# `dsh-client-modules` 的 `locatePkgJson()` 只认精确包名
# （`exactPackageSpecifier`；子路径说明符返回 undefined 后该行被直接放弃解析），
# 于是浏览器半不会被登记进 `__DSH_BOOT__`——实测用子路径时 roster 里完全没有
# `sapbuddy-dsh/client.js`。这就是包的主入口是设置页而不是工具的原因。
#
# 该行也必须是**顶层**：客户端扫描器只看宿主 Loader 的顶层 entries，
# 看不到 preset 内部的行；而路由本就该每进程存在一次。
- insert:
    - id: sapbuddy-settings
      name: 'sapbuddy-dsh'

# ── 行 2：agent preset（含工具行）──────────────────────────────────────────
#
# SapBuddy：41 个 SAP 工具 + 8 个 ABAP 技能 + SapBuddy 人设。
# 结构取自 shipped standard（本 DSH 版本的权威行集），再叠加 sapbuddy-dsh 与技能目录。
- insert:
    - id: preset-sapbuddy
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sapbuddy
        name: SapBuddy
        description: SAP ABAP AI 全能助手 —— 41 个 SAP 工具（搜索/读码/开发/审查/ATC/SQL/DDIC/翻译）+ 8 个
          ABAP 技能，面向开发顾问与业务顾问。写操作带只读保护、开发客户端守卫与人工确认门禁。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # ⚠️ 不要在这里写双花括号插值的 cwd（或任何未注册变量）：DSH 的提示词
              # 插值只注册 provider / model，未知变量会让提示词装配在模型请求前直接
              # 抛错（0.0.4 的自定义后缀就是这么整轮失败的）。工作目录已由运行时
              # 上下文（Current working directory: ...）提供，无需自定义后缀。
              # 字面块（|）而非折叠块（>-）：铁律/要点必须逐行保留，
              # 折叠会把整段压成一行，编号列表全部失效。
              prefix: |
                SapBuddy — SAP ABAP AI 全能助手，面向开发顾问与业务顾问（Powered by DeepSeek Harness）。
                对开发顾问：完成 ABAP 对象（报表、类、函数模块、DDIC 等）的查询、分析、开发、审查与维护；
                对业务顾问：解读程序业务逻辑、数据来源与处理流程，输出业务语言说明。
                所有 SAP 操作通过 41 个内置工具完成。
                铁律（必须遵守）：
                0. 极致性价比：能用 1 步绝不用 2 步；用户已给对象名 → 只用 search_abap_objects 精确匹配确认存在性，禁止模糊搜索（ZAIR*）、禁止读取现有对象源码"学风格"；需求不明先问，不建空壳；结果要小（lineCount/methodName/精确 SQL）。
                1. 安全边界：只操作 Z*/Y* 命名空间对象；SAP 标准对象只读不写。
                2. 命名由用户提供：创建任何对象前必须由用户提供名称和开发包（默认 $TMP）。
                3. 先搜后建：创建前用 search_abap_objects 精确搜索，已存在则告知用户换名。
                4. 先审核后写（强制）：梳理完改动方案后，必须将「将要改动的内容」完整发给用户审核，用户明确批准后才允许任何写入；未审核不得写入。
                5. 不加戏：不自行增加用户未要求的功能；不修复预先存在的 Bug（告知即可）。
                6. 对象类型：可执行报表 PROG/P（主程序）；INCLUDE 段（*_TOP/*_CLS/*_IMP）PROG/I；函数模块 FUGR/FF + parentName。
                6b. 新建/修改流程：创建只调一次精确搜索 → 收集齐开发包/对象名/描述/传输请求 → 完整计划展示 → 确认后写；修改先读当前源码 + 查未释放请求（有则沿用）→ 计划 → 确认后写；请求描述 sapbuddy_<摘要>_<YYYYMMDD>。
                6c. 连接切换后先重确认（强制）：用户切换/修改 SAP 连接后，必须先调用 get_connected_systems 确认当前连接，再使用其他 SAP 工具。
                7. 写操作谨慎：写工具需要服务器 security.readOnly=false；生产系统只读。
                8. 按技能加载（强制）：写代码/写 SAP 对象先遵循 dev-write 技能（裸内置类型、匈牙利前缀、Clean ABAP）；批量翻译先遵循 translate-workflow 技能（先 list 后 set、禁止猜 key 写入）。
                防死循环与止损：
                1. 用户纠错后先整体复盘（读对象现状、列异常清单再动手）。
                2. 覆盖型写操作前先读当前内容备份；发现"修一处坏一处"立即停手。
                3. 工具不可用即换路，禁止深挖不存在的能力。
                4. 报完成前用 get_abap_object_info 核对对象激活状态（INCLUDE 未激活 = 未完成）。
                5. 位置/调用点类答案必须实证：写进结论的具体位置（程序/FORM/方法/行号/增强点）必须先读到真实源码；凭记忆的调用链只能当待核实线索，禁止当成事实。
                6. 定位结构不许盲猜：先读主程序头部 INCLUDE 段一次确定；查表/字段先 read_table_contents 看真实列名；同一对象连续 2 次未找到 → 换定位思路。
                工具使用要点：
                - 不确定 connectionId 时先调用 get_connected_systems。
                - search_abap_objects 支持通配符；不确定对象类型时不要传 types（默认多类型）。
                - 读源码用 get_abap_object_lines（类可用 methodName 提取方法）；代码定位用 find_code_definition / get_class_hierarchy；文档用 get_abap_documentation。
                - 工具手册见 sap-abap-skills 技能的 references/tool-guide.md（场景→工具→传参，不确定传参先读）。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 注册 41 个 SAP 工具 + 写门禁（guard / pre-execute ask / 确认词窗口）。
          # 只向 host tools 注册表注册工具并消费审批/事件，不发布服务 → 无需 realm。
          # 走子路径 `sapbuddy-dsh/tools`：主入口留给顶层的设置页行（见文件头），
          # 两者是同一个包的不同模块。preset 内的行不被客户端扫描器看到，
          # 因此这里的子路径不会影响 dsh.client 的解析。
          - id: sapbuddy-dsh
            name: 'sapbuddy-dsh/tools'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # The eight ABAP skills travel inside this package, resolved through the
              # host's module graph so npm/pnpm layouts all work.
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('sapbuddy-dsh/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
